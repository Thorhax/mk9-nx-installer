name: Deploy to GitHub Pages

# The NRO is not in this repository: it is an asset (mk9.nro) of a release of the mk9-nx repository of the same
# owner. Each deployment downloads it into release/, checks it against release/manifest.json and publishes the page
# with it. Run it by hand (Actions > Deploy to GitHub Pages > Run workflow) after publishing a new release there.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Release of mk9-nx to take the NRO from (empty for the latest)
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the NRO of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository_owner }}/mk9-nx
        run: gh release download $TAG --repo "$REPO" --pattern 'mk9.nro' --dir release --clobber

      - name: Check it against the list of builds
        run: node .github/verify_release.mjs

      - name: Assemble the site
        run: |
          mkdir _site
          cp -r index.html *.js icons shader_common.h renut_shader_common.h lib wasm release _site/

      # every file sw.js lists must be in the site (1.0.0 went out without deko3d_worker.js: "a shader worker failed")
      - name: Check the site has every page file
        working-directory: _site
        run: |
          node -e "
            const fs = require('fs');
            const list = fs.readFileSync('sw.js', 'utf8').match(/PAGE_FILES = \[([^\]]*)\]/)[1].match(/'[^']+'/g)
              .map((s) => s.slice(1, -1)).filter((f) => f !== './');
            const missing = list.filter((f) => !fs.existsSync(f));
            if (missing.length) { console.error('missing from the site:', missing.join(' ')); process.exit(1); }
            console.log(list.length, 'page files present');"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
